# apps/api/pyproject.toml
[project]
name = "proservice-ocr-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic==2.9.*",
  "sqlalchemy==2.0.*",
  "python-multipart==0.0.*",
  "pymupdf==1.24.*",
  "pillow==11.0.*",
  "anthropic>=0.90,<1.0",
  "python-dotenv==1.0.*",
  "python-Levenshtein==0.26.*",
]

[project.optional-dependencies]
dev = ["pytest==8.3.*", "httpx==0.28.*", "pytest-asyncio==0.24.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
